[project]
name = "keywoo"
version = "0.0.14"
description = "A small URL opener web app built with Flask."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Click==8.5.1",
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-SQLAlchemy==3.1.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
    "psycopg2==2.9.13",
    "SQLAlchemy==2.1.9",
    "uWSGI==2.0.31",
    "Werkzeug==3.1.9",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[tool.uv]
# The application is deployed as source, not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=keywoo --cov-report=term-missing"

[tool.coverage.run]
source = ["keywoo"]

[tool.coverage.report]
# Fail the test run when coverage regresses below the current level.
fail_under = 80
